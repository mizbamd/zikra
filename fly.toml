# Documented default for the Zikra API. Creating a Fly account is not required to merge.
# When you are ready: see docs/DEPLOY.md. No secrets in this file.

app = "zikra-api"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  ZIKRA_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
